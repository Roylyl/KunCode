name: Prevent engineering system changes in PRs

on: pull_request

permissions:
  pull-requests: read

jobs:
  main:
    name: Prevent engineering system changes in PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep the policy inline: never execute a policy script from the PR checkout.
      - name: Check engineering changes and repository permissions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository = context.repo;
            // The files API returns at most 3,000 files. Do not approve an incomplete diff.
            if (pr.changed_files > 3000) {
              core.setFailed('This PR exceeds the files API limit; split it before running the engineering policy check.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repository,
              pull_number: pr.number,
              per_page: 100
            });
            const protectedPath = /^(?:\.github\/|build\/|scripts\/)|(?:^|\/)package(?:-lock)?\.json$/;
            const changed = files.filter(file => protectedPath.test(file.filename)
              || (file.previous_filename && protectedPath.test(file.previous_filename)));
            if (changed.length === 0) {
              core.info('No engineering system files were modified.');
              return;
            }
            core.info(`Engineering system files modified: ${changed.map(file => file.filename).join(', ')}`);

            // Dependabot needs to update manifests, lockfiles and pinned workflow actions.
            if (pr.user.login === 'dependabot[bot]') {
              core.info('Allowing dependency updates from Dependabot.');
              return;
            }
            if (['Copilot', 'copilot-swe-agent[bot]'].includes(pr.user.login)) {
              core.setFailed('Copilot cannot modify engineering systems. A repository maintainer must make these changes.');
              return;
            }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...repository,
              username: pr.user.login
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('Engineering system changes require write access to this repository.');
              return;
            }
            core.info(`Allowing engineering changes by a contributor with ${data.permission} access to ${repository.owner}/${repository.repo}.`);